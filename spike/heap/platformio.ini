; THROWAWAY. Spike only - answers the heap-budget question, then gets deleted.
[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_port = COM8
monitor_port = COM8
build_flags = -DCORE_DEBUG_LEVEL=0

[env:stage1]
build_src_filter = +<stage1.cpp>

[env:stage2]
build_src_filter = +<stage2.cpp>
lib_deps = bblanchon/ArduinoJson@^7.1.0

[env:stage3]
build_src_filter = +<stage3.cpp>
lib_deps = bblanchon/ArduinoJson@^7.1.0
