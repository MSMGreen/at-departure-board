name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  renderer:
    name: Renderer and tools (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned: the golden renders are compared byte-exact, so the Pillow
          # in requirements-dev.txt has to be the one it was built against.
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest

  firmware-tests:
    name: Firmware logic (pio test -e native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-native-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install platformio
      - run: pio test -e native

  firmware-build:
    name: Firmware builds (esp32, esp32_demo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp32-${{ hashFiles('platformio.ini') }}
      - run: python -m pip install platformio
      # Both builds include src/secrets.h, which is gitignored. The unedited
      # template compiles, which is all a build check needs.
      - run: cp src/secrets.example.h src/secrets.h
      - run: pio run -e esp32
      - run: pio run -e esp32_demo
