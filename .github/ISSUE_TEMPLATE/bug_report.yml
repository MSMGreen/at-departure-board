name: Bug report
description: Something on the board, the renderer, or the setup guide is wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Flashing trouble? [docs/SETUP.md §10](../blob/HEAD/docs/SETUP.md#10-troubleshooting)
        covers the common ones — the BOOT/EN dance, blank screens, HTTP 401.

  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - On the hardware (live build)
        - On the hardware (demo build)
        - In the simulator / renderer on my PC
        - Building or flashing
        - In the docs
    validations:
      required: true

  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected instead
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      placeholder: |
        1. ...
        2. ...

  - type: textarea
    id: serial
    attributes:
      label: Serial log
      description: >
        For anything on hardware, paste the log from boot — `pio device monitor`
        at 115200. It usually says exactly what went wrong. No need to redact
        your stop codes; do redact anything else.
      render: text

  - type: input
    id: hardware
    attributes:
      label: Board and panel
      placeholder: ESP32 WROOM-32 DevKit, 2.8" panel from <link>, ST7789

  - type: input
    id: version
    attributes:
      label: Commit
      placeholder: output of `git rev-parse --short HEAD`
